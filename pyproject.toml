[project]
name = "qlib-hypothesis-lab"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.3",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=2.2,<3",
    "pyqlib==0.9.7",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "yahooquery>=2.4.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
